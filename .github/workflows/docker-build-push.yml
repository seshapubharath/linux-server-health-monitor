name: Build, Test, Push and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test Bash Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check Bash syntax
        run: bash -n scripts/*.sh

      - name: Run ShellCheck
        run: shellcheck --severity=warning scripts/*.sh

      - name: Run automated tests
        run: bash tests/test_shell_syntax.sh

      - name: Run functional tests
        run: bash tests/test_utils.sh

      - name: Test alert logic
        run: bash tests/test_alert_logic.sh

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/linux-server-health-monitor:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/linux-server-health-monitor:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: [self-hosted, Linux, X64]
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy image to EC2
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          cd /home/ec2-user/linux-server-health-monitor

          git fetch origin main
          git reset --hard origin/main

          echo "Deploying image tag: ${IMAGE_TAG}"

          docker compose pull monitor
          docker compose run --rm monitor
