name: Build and Push Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/linux-server-health-monitor:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/linux-server-health-monitor:${{ github.sha }}

  deploy:
    runs-on: [self-hosted, Linux, X64]
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy image to EC2
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd /home/ec2-user/linux-server-health-monitor

          echo "Deploying image tag: ${IMAGE_TAG}"

          docker compose pull monitor
          docker compose run --rm monitor
