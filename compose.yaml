services:
  monitor:
    
    image: bharathchands/linux-server-health-monitor:${IMAGE_TAG:-latest}

    pid: host
    network_mode: host

    volumes:
      - /run:/run:ro
      - /:/host:ro
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./config/config.env:/app/config/config.env:ro
